name: Build
run-name: KomaruGram — ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to rebuild from the current main source
        required: false
        type: string

permissions:
  contents: write
  # The Linux build environment image lives in GHCR.
  packages: write

jobs:

  windows:
    name: Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # Test builds need only x64; releases ship x86 as well.
        arch: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && '["x64", "x64_x86"]' || '["x64"]') }}

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%

      - name: Configure git auth for private repo.
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      # Everything has to stay on C: for real: prepare.py finds its root
      # from the resolved path of its own script and keys every library by
      # resolved paths, and tar replaces a junction with a plain folder when
      # it restores the build cache. C: lacks room for the libraries and the
      # build together, so big preinstalled tools the build never uses go,
      # all at once.
      - name: Free disk space on C:.
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          $paths = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\ghcup',
            'C:\Program Files\MongoDB',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\R',
            'C:\rtools45',
            'C:\rtools44',
            'C:\Strawberry',
            'C:\Julia',
            'C:\Miniconda',
            'C:\SeleniumWebDrivers',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files\Mozilla Firefox',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\stack'
          ) | Where-Object { Test-Path $_ }
          $jobs = $paths | ForEach-Object {
            Start-Process cmd -ArgumentList '/c', "rmdir /s /q `"$_`"" -NoNewWindow -PassThru
          }
          $jobs | Wait-Process -Timeout 600 -ErrorAction SilentlyContinue
          $after = (Get-PSDrive C).Free / 1GB
          "Removed: $($paths -join ', ')"
          "C: free: {0:N1} GB -> {1:N1} GB" -f $before, $after

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win-x64.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile vs_buildtools.exe
          $p = Start-Process -FilePath .\vs_buildtools.exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item vs_buildtools.exe -Force
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ matrix.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Libraries.
        run: |
          cd %TBUILD%
          %REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="KomaruGram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          echo "TDESKTOP_BUILD_GENERATOR=" >> $GITHUB_ENV
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          echo "TDESKTOP_BUILD_DEFINE=" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}"
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: find TBuild/Libraries '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name 'Makefile' -o -name '*.pc' -o -path '*/include/*' -o -path '*/src/wallet_engine/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ matrix.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}

      - name: Build cache.
        id: cache-build
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.OS }}-${{ matrix.arch }}-build-${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-build-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ matrix.arch }}-build-

      # Telegram/rust/komaru_tools: the helpers the steps below call.
      - name: KomaruGram tools.
        if: env.ONLY_CACHE == 'false'
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          cargo build -q --release --locked \
            --manifest-path Telegram/rust/komaru_tools/Cargo.toml \
            --target-dir "$RUNNER_TEMP/komaru_tools"
          echo "KOMARU=$RUNNER_TEMP/komaru_tools/release/komaru" >> $GITHUB_ENV

      # Checkout gives every file a new date, so MSBuild rebuilt everything
      # despite the cached objects. Files unchanged since the cached build
      # get an old date and only the changed ones are compiled again.
      - name: Keep file dates for the cached build.
        if: env.ONLY_CACHE == 'false' && steps.cache-build.outputs.cache-matched-key != ''
        shell: bash
        env:
          MATCHED: ${{ steps.cache-build.outputs.cache-matched-key }}
        run: |
          "$KOMARU" ci keep-dates --repo "$TBUILD/$REPO_NAME" --old "${MATCHED##*-}"

      - name: Update signing setup.
        if: env.ONLY_CACHE == 'false'
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Only tagged releases are signed. Everything else builds the
          # updater into the client but never touches the private key.
          if [[ "$GITHUB_REF" != refs/tags/* && -z "$RELEASE_TAG" ]]; then
            echo "BUILD_PACKER=OFF" >> $GITHUB_ENV
            exit 0
          fi
          if [ -z "$UPDATE_PRIVATE_KEY" ]; then
            echo "::error::The UPDATE_PRIVATE_KEY secret is not set."
            exit 1
          fi
          echo "BUILD_PACKER=ON" >> $GITHUB_ENV
          "$KOMARU" ci packer-key \
            --out "$TBUILD/$REPO_NAME/Telegram/SourceFiles/_other/packer_private.h"

      # Telegram/rust/komaru_core. The runner has rustup with the x64 MSVC
      # toolchain; the 32-bit build needs its target too.
      - name: Rust toolchain.
        if: env.ONLY_CACHE == 'false'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x64_x86" ]; then
            rustup target add i686-pc-windows-msvc
          fi
          rustc --version
          cargo --version

      - name: KomaruGram build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=MinSizeRel ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D KOMARUGRAM_BUILD_PACKER=%BUILD_PACKER% ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config MinSizeRel --parallel 1 -- /p:CL_MPCount=4 /p:UseMultiToolTask=true /p:EnforceProcessCountAcrossBuilds=true

      - name: Pack update.
        if: env.ONLY_CACHE == 'false' && env.BUILD_PACKER == 'ON'
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*constexpr auto AppVersion = \([0-9]*\);.*/\1/p' \
            "$TBUILD/$REPO_NAME/Telegram/SourceFiles/core/version.h")
          [ -n "$VERSION" ] || { echo "::error::AppVersion not found"; exit 1; }
          echo "UPDATE_VERSION=$VERSION" >> $GITHUB_ENV

          TARGET=""
          [ "${{ matrix.arch }}" = "x64" ] && TARGET="-target win64"

          cd "$TBUILD/$REPO_NAME/out/MinSizeRel"
          ./Packer.exe -path KomaruGram.exe -path Updater.exe -version "$VERSION" $TARGET

          mkdir -p "$GITHUB_WORKSPACE/update"
          mv tx64upd* tupdate* "$GITHUB_WORKSPACE/update/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/update"
          [ -n "$(ls -A "$GITHUB_WORKSPACE/update")" ] || { echo "::error::Packer wrote no update file"; exit 1; }

      - name: Scrub signing material.
        if: always()
        shell: bash
        run: |
          # The private key is compiled into Packer. Nothing that carries it
          # may reach the Actions cache, which a public repo cannot guard.
          rm -f "$TBUILD/$REPO_NAME/Telegram/SourceFiles/_other/packer_private.h"
          rm -f "$TBUILD/$REPO_NAME/out/MinSizeRel/Packer.exe" \
                "$TBUILD/$REPO_NAME/out/MinSizeRel/Packer.pdb"
          find "$TBUILD/$REPO_NAME/out" -type d -name 'Packer.dir' -prune -exec rm -rf {} + 2>/dev/null || true
          if find "$TBUILD/$REPO_NAME/out" -iname '*packer*.obj' | grep -q .; then
            echo "::error::Packer object files survived the scrub"
            exit 1
          fi

      - name: Build cache size.
        if: env.ONLY_CACHE == 'false'
        shell: bash
        run: du -sm TBuild/$REPO_NAME/out || true

      - name: Save build cache.
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.OS }}-${{ matrix.arch }}-build-${{ env.CACHE_KEY }}-${{ github.sha }}

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\MinSizeRel
          mkdir artifact
          move %OUT%\KomaruGram.exe artifact/
          move %OUT%\Updater.exe artifact/
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\

      - name: Publish release.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "${{ matrix.arch }}" in
            x64_x86) SUFFIX="x86";;
            *) SUFFIX="${{ matrix.arch }}";;
          esac
          REPO="$GITHUB_REPOSITORY"
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"

          # Updater.exe must sit next to the client or updates cannot apply.
          ZIP="KomaruGram-$TAG-windows-$SUFFIX.zip"
          (cd artifact && 7z a -tzip -mx=9 "../$ZIP" KomaruGram.exe Updater.exe >/dev/null)

          # Not marked latest yet: the update feed is served from the latest
          # release, so the feed job promotes it once current6 is in place.
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --title "KomaruGram $TAG" --notes "Built from $GITHUB_SHA." --verify-tag --latest=false || true
          fi
          gh release upload "$TAG" -R "$REPO" --clobber "$ZIP" update/*

  linux:
    name: Linux
    # Releases only: test builds are Windows x64.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: komarugram:build

    steps:
      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare Dockerfile.
        run: |
          python3 -m venv "$RUNNER_TEMP/dockerfile-generator"
          "$RUNNER_TEMP/dockerfile-generator/bin/python" -m pip install Jinja2==3.1.6
          cd Telegram/build/docker/centos_env
          DEBUG= LTO= "$RUNNER_TEMP/dockerfile-generator/bin/python" gen_dockerfile.py > Dockerfile.generated
          grep -q '^FROM ' Dockerfile.generated

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Building the image takes well over an hour, so it is pushed to GHCR
      # under a hash of its recipe and only pulled while that stays the same.
      - name: Find the build environment image.
        id: env_image
        run: |
          HASH=$(cat Telegram/build/docker/centos_env/Dockerfile.generated \
            Telegram/build/docker/centos_env/build.sh \
            | sha256sum | cut -c1-16)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/komarugram-build-env:$HASH"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          if docker pull "$IMAGE"; then
            docker tag "$IMAGE" "$IMAGE_TAG"
            echo "cached=true" >> $GITHUB_OUTPUT
          else
            echo "cached=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image.
        if: steps.env_image.outputs.cached != 'true'
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          file: Telegram/build/docker/centos_env/Dockerfile.generated
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Push the build environment image.
        if: steps.env_image.outputs.cached != 'true'
        continue-on-error: true
        run: |
          docker tag "$IMAGE_TAG" "${{ steps.env_image.outputs.image }}"
          docker push "${{ steps.env_image.outputs.image }}"

      - name: Update signing setup.
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Only tagged releases are signed, as on Windows.
          if [[ "$GITHUB_REF" != refs/tags/* && -z "$RELEASE_TAG" ]]; then
            echo "BUILD_PACKER=OFF" >> $GITHUB_ENV
            exit 0
          fi
          if [ -z "$UPDATE_PRIVATE_KEY" ]; then
            echo "::error::The UPDATE_PRIVATE_KEY secret is not set."
            exit 1
          fi
          echo "BUILD_PACKER=ON" >> $GITHUB_ENV
          cargo run -q --release --locked \
            --manifest-path Telegram/rust/komaru_tools/Cargo.toml \
            --target-dir "$RUNNER_TEMP/komaru_tools" -- \
            ci packer-key --out Telegram/SourceFiles/_other/packer_private.h

      # The image has no Rust: the runner's rustup is mounted instead.
      - name: KomaruGram build.
        run: |
          rustc --version
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v $HOME/.cargo:/opt/cargo \
          -v $HOME/.rustup:/opt/rustup \
          -e CARGO_HOME=/opt/cargo \
          -e RUSTUP_HOME=/opt/rustup \
          -w /usr/src/tdesktop \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D Rust_COMPILER=/opt/cargo/bin/rustc \
          -D Rust_CARGO=/opt/cargo/bin/cargo \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_INSTALL_PREFIX="/usr" \
          -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} \
          -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D KOMARUGRAM_BUILD_PACKER=$BUILD_PACKER

      - name: Pack update.
        if: env.BUILD_PACKER == 'ON'
        run: |
          VERSION=$(sed -n 's/.*constexpr auto AppVersion = \([0-9]*\);.*/\1/p' \
            Telegram/SourceFiles/core/version.h)
          [ -n "$VERSION" ] || { echo "::error::AppVersion not found"; exit 1; }

          BIN=$(dirname "$(find out -maxdepth 2 -type f -name Updater | head -1)")
          [ -x "$BIN/Packer" ] || { echo "::error::Packer not found next to Updater in '$BIN'"; exit 1; }

          # Clients get the same stripped binaries the archives carry.
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -w "/usr/src/tdesktop/$BIN" \
          $IMAGE_TAG \
          bash -c "strip KomaruGram Updater && ./Packer -path KomaruGram -path Updater -version $VERSION"

          mkdir -p update
          mv "$BIN"/tlinuxupd* update/
          ls -la update
          [ -n "$(ls -A update)" ] || { echo "::error::Packer wrote no update file"; exit 1; }

      - name: Scrub signing material.
        if: always()
        run: |
          rm -f Telegram/SourceFiles/_other/packer_private.h
          find out -maxdepth 2 -type f -name Packer -delete 2>/dev/null || true
          find out -type d -name 'Packer.dir' -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Create archives.
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          # Branch names like claude/foo would otherwise point into a folder.
          TAG="${TAG//\//-}"
          mkdir -p dist

          # The usr tree is for installing system-wide; such installs
          # do not update themselves.
          (cd out/install && tar -I 'zstd -T0 --ultra -22' -cf "../../dist/KomaruGram-$TAG.tar.zst" usr)

          # The portable folder updates itself: Updater must sit next to
          # the client in a folder the user can write to.
          mkdir -p portable/KomaruGram
          BIN=$(dirname "$(find out -maxdepth 2 -type f -name Updater | head -1)")
          cp "$BIN/KomaruGram" "$BIN/Updater" portable/KomaruGram/
          [ -n "$(ls update 2>/dev/null)" ] || strip portable/KomaruGram/KomaruGram portable/KomaruGram/Updater
          tar -C portable -cJf "dist/KomaruGram-$TAG-linux-x64.tar.xz" KomaruGram
          ls -la dist

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: KomaruGram Linux
          path: dist/

      - name: Publish release.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --title "KomaruGram $TAG" --notes "Built from $GITHUB_SHA." --verify-tag --latest=false || true
          fi
          gh release upload "$TAG" -R "$REPO" --clobber dist/* update/*

  feed:
    name: Update feed
    # Runs only when every Windows build succeeded. Publishing the feed from
    # the build jobs let the first one to finish point clients at a package
    # the other had not uploaded yet, or never would. A failed Linux build
    # only leaves Linux out of the feed.
    needs: [windows, linux]
    if: always() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && needs.windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Get version.
        uses: actions/checkout@v7
        with:
          sparse-checkout: Telegram/SourceFiles/core/version.h
          sparse-checkout-cone-mode: false

      - name: Publish update feed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          V=$(sed -n 's/.*constexpr auto AppVersion = \([0-9]*\);.*/\1/p' \
            Telegram/SourceFiles/core/version.h)
          [ -n "$V" ] || { echo "::error::AppVersion not found"; exit 1; }

          ASSETS=$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name')
          for f in "tx64upd$V" "tupdate$V"; do
            grep -qx "$f" <<< "$ASSETS" || { echo "::error::$f is not in the release"; exit 1; }
          done

          LINUX=""
          if [ "${{ needs.linux.result }}" = "success" ] && grep -qx "tlinuxupd$V" <<< "$ASSETS"; then
            LINUX=$(printf ',"linux":{"stable":{"released":"%s","link":"/tlinuxupd%s"}}' "$V" "$V")
          else
            echo "::warning::Linux is left out of the update feed"
          fi

          printf '{"win64":{"stable":{"released":"%s","link":"/tx64upd%s"}},"win":{"stable":{"released":"%s","link":"/tupdate%s"}}%s}\n' \
            "$V" "$V" "$V" "$V" "$LINUX" > current6
          cat current6
          gh release upload "$TAG" -R "$REPO" --clobber current6
          gh release edit "$TAG" -R "$REPO" --latest
