[package]
name = "komaru_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native parts of KomaruGram written in Rust"

# No dependencies on purpose: the crate builds offline in seconds and talks
# to the sqlite3.c that the client already compiles, through komaru_set_sqlite.

[lib]
# rlib: prepare.py builds the crate into tdesktop_rust on Windows and macOS.
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = "s"
codegen-units = 1
debug = false
